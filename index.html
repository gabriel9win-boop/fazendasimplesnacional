<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Função para consultar CNPJ
    async function consultarCNPJ(cnpj) {
        console.log('🔍 Consultando CNPJ:', cnpj);
        
        try {
            const formData = new FormData();
            formData.append('cnpj', cnpj);

            // Primeira chamada - salvar_cnpj.php
            const response = await fetch('/salvar_cnpj.php', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Erro HTTP: ' + response.status);

            const result = await response.json();
            console.log('📥 Resposta da consulta:', result);

            if (result.success && result.data) {
                // Formatar CNPJ se necessário
                const cnpjFormatado = result.data.cnpj_formatado || formatarCNPJ(cnpj);
                const nomeEmpresa = result.data.nome_empresa || 'EMPRESA NÃO ENCONTRADA';
                
                console.log('✅ Dados recebidos:', { cnpj, cnpjFormatado, nomeEmpresa });

                // Salvar dados na sessão
                const saveResponse = await fetch('/api/salvar-cnpj-consulta', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        cnpj: cnpj,
                        cnpj_formatado: cnpjFormatado,
                        nome_empresa: nomeEmpresa
                    })
                });

                if (!saveResponse.ok) {
                    console.error('❌ Erro ao salvar na sessão');
                }

                // Redirecionar para página de início
                window.location.href = '/inicio';
            } else {
                alert('CNPJ não encontrado ou inválido');
                if (window.continuarBtn) {
                    window.continuarBtn.disabled = false;
                    window.continuarBtn.innerHTML = '<span class="ladda-label">Continuar</span>';
                }
            }
        } catch (error) {
            console.error('❌ Erro:', error);
            alert('Erro ao consultar CNPJ: ' + error.message);
            if (window.continuarBtn) {
                window.continuarBtn.disabled = false;
                window.continuarBtn.innerHTML = '<span class="ladda-label">Continuar</span>';
            }
        }
    }

    // Função para formatar CNPJ
    function formatarCNPJ(cnpj) {
        return cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    }

    // Aguardar DOM carregar
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Página carregada, configurando formulário...');
        
        // Tentar encontrar o formulário dentro do frame
        setTimeout(function() {
            const frame = document.querySelector('frame[name="main"]');
            if (frame && frame.contentDocument) {
                const frameDoc = frame.contentDocument;
                const form = frameDoc.querySelector('form');
                const cnpjInput = frameDoc.getElementById('f5h8v');
                const continuarBtn = frameDoc.getElementById('q9j2x');
                
                window.continuarBtn = continuarBtn;

                if (form) {
                    console.log('✅ Formulário encontrado dentro do frame');
                    
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        let cnpj = cnpjInput ? cnpjInput.value : '';
                        cnpj = cnpj.replace(/\D/g, '');
                        
                        if (cnpj.length !== 14) {
                            alert('CNPJ inválido! Digite um CNPJ com 14 números.');
                            return;
                        }
                        
                        console.log('✅ Formulário submetido com CNPJ:', cnpj);
                        
                        if (continuarBtn) {
                            continuarBtn.disabled = true;
                            continuarBtn.innerHTML = '<span class="ladda-label">Consultando...</span>';
                        }
                        
                        consultarCNPJ(cnpj);
                    });
                    
                    console.log('✅ Listener adicionado ao formulário');
                } else {
                    console.error('❌ Formulário não encontrado dentro do frame');
                }
            } else {
                console.error('❌ Frame não encontrado ou não acessível');
                
                // Fallback: tentar no documento principal
                const form = document.querySelector('form');
                const cnpjInput = document.getElementById('f5h8v');
                const continuarBtn = document.getElementById('q9j2x');
                
                window.continuarBtn = continuarBtn;

                if (form) {
                    console.log('✅ Formulário encontrado no documento principal');
                    
                    form.addEventListener('submit', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        let cnpj = cnpjInput ? cnpjInput.value : '';
                        cnpj = cnpj.replace(/\D/g, '');
                        
                        if (cnpj.length !== 14) {
                            alert('CNPJ inválido! Digite um CNPJ com 14 números.');
                            return;
                        }
                        
                        console.log('✅ Formulário submetido com CNPJ:', cnpj);
                        
                        if (continuarBtn) {
                            continuarBtn.disabled = true;
                            continuarBtn.innerHTML = '<span class="ladda-label">Consultando...</span>';
                        }
                        
                        consultarCNPJ(cnpj);
                    });
                    
                    console.log('✅ Listener adicionado ao formulário');
                } else {
                    console.error('❌ Formulário não encontrado em lugar nenhum!');
                }
            }
        }, 1000); // Aguardar 1 segundo para o frame carregar
    });
</script>
